[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/strf0x1/construct"
publish = false

# Shared by the workspace crates. Each crate adds the features it needs.
[workspace.dependencies]
# The engine library; the construct binary is its composition root (ADR 0048).
construct-core = { path = "crates/construct-core" }
# The TUI front end; only the construct binary starts it (#277).
construct-tui = { path = "crates/construct-tui" }
# Deck-only tools, above the engine; the construct binary wires them in (#314).
construct-deck = { path = "crates/construct-deck" }
# The web tools, above the engine; the binary's `web` feature wires them in (#271).
construct-tools-web = { path = "crates/construct-tools-web" }
anyhow = "1"
# Both the engine and the TUI name async trait impls.
async-trait = "0.1"
clap = { version = "4.6", features = ["derive"] }
futures = "0.3"
# The journal (docs/adr/0008). bundled: no system libsqlite3, and FTS5 and
# JSON functions are compiled in.
rusqlite = { version = "0.41", features = ["bundled", "hooks"] }
# The TUI's quiet_stderr and the engine's sandbox/acp both dup descriptors.
libc = "0.2"
# rustls-no-provider: the plain "rustls" feature hardwires aws-lc-rs (a
# BoringSSL fork, MBs of code). ring is installed at startup instead (#271).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
# preserve_order everywhere: JSON keeps wire order, and snapshot key order
# doesn't depend on which crates a test run happens to unify.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
secretspec = { version = "0.21", default-features = false, features = ["keyring"] }
tokio = "1"
toml = "1"
toml_edit = "0.25"
# Property tests (dev only): shrinking turns a random panic into a pinnable
# counterexample. Without fork/timeout, which pull in a subprocess runner.
proptest = { version = "1", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "allow" # module docs are required by convention; item docs are not

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 } # turn on individual pedantic lints later if they earn it
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn" # outside tests; a Mutex lock gets #[expect(..., reason = "poisoned lock: ...")]
expect_used = "warn"
string_slice = "warn" # a byte-offset slice panics off a char boundary; use get(..) or a boundary helper
allow_attributes = "warn" # escape hatches are #[expect], which fails once it goes stale
allow_attributes_without_reason = "warn"

[profile.dev]
# Every integration test links the whole lib; full debuginfo made each
# executable ~360 MB. Backtraces still get file:line.
debug = "line-tables-only"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
