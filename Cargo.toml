[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/strf0x1/construct"
publish = false

# Shared by both crates. Each crate adds the features it needs.
[workspace.dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
futures = "0.3"
# The journal (docs/adr/0008). bundled: no system libsqlite3, and FTS5 and
# JSON functions are compiled in.
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
# preserve_order everywhere: JSON keeps wire order, and snapshot key order
# doesn't depend on which crates a test run happens to unify.
serde_json = { version = "1", features = ["preserve_order"] }
tokio = "1"
# Property tests (dev only): shrinking turns a random panic into a pinnable
# counterexample. Without fork/timeout, which pull in a subprocess runner.
proptest = { version = "1", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "allow" # module docs are required by convention; item docs are not

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 } # turn on individual pedantic lints later if they earn it
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn" # outside tests; a Mutex lock gets #[expect(..., reason = "poisoned lock: ...")]
expect_used = "warn"
string_slice = "warn" # a byte-offset slice panics off a char boundary; use get(..) or a boundary helper
allow_attributes = "warn" # escape hatches are #[expect], which fails once it goes stale
allow_attributes_without_reason = "warn"

[profile.dev]
# Every integration test links the whole lib; full debuginfo made each
# executable ~360 MB. Backtraces still get file:line.
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
