<title>Construct Work Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a header with three views (System canvas, Work DAG, Next board); a detail drawer slides in from the right (bottom sheet on phones). */
:root{
  --bg:#f3f5f4; --panel:#ffffff; --ink:#17201d; --muted:#5d6b66; --line:#d5ddd9; --grid:#e4eae7;
  --accent:#0f7b74; --accent-soft:#d6efec;
  --st-ready:#2f8f4e; --st-experiment:#7a4fc4; --st-decide:#b7791f; --st-shape:#6b7a85; --st-waiting:#c2410c; --st-done:#a3b0ab; --st-dropped:#c9d1ce;
  --edge:#b6c2bd; --edge-hi:#0f7b74;
  --f-display:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1413; --panel:#151d1b; --ink:#e3ebe8; --muted:#8fa09a; --line:#26322f; --grid:#1a2321;
  --accent:#4fd1c5; --accent-soft:#143633;
  --st-ready:#5bc77d; --st-experiment:#a98bf0; --st-decide:#e3a94a; --st-shape:#8796a1; --st-waiting:#f08a5d; --st-done:#4a5853; --st-dropped:#323d3a;
  --edge:#34423e; --edge-hi:#4fd1c5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1413; --panel:#151d1b; --ink:#e3ebe8; --muted:#8fa09a; --line:#26322f; --grid:#1a2321;
  --accent:#4fd1c5; --accent-soft:#143633;
  --st-ready:#5bc77d; --st-experiment:#a98bf0; --st-decide:#e3a94a; --st-shape:#8796a1; --st-waiting:#f08a5d; --st-done:#4a5853; --st-dropped:#323d3a;
  --edge:#34423e; --edge-hi:#4fd1c5; color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.mono{font-family:var(--f-mono)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand h1{font-family:var(--f-display);font-size:18px;font-weight:700;margin:0;letter-spacing:-.01em}
.brand small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
nav.views{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px}
nav.views button{border:0;background:transparent;padding:6px 12px;border-radius:6px;cursor:pointer;font-weight:600;color:var(--muted)}
nav.views button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
nav.views button:focus-visible,.chip:focus-visible,.card:focus-visible,.tool:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;margin-left:auto;font-size:12px;color:var(--muted)}
.stats b{font-family:var(--f-mono);color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.filterbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:12px;color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chip .x{color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
main{flex:1;position:relative;min-height:0;display:flex}
.view{flex:1;min-width:0;position:relative;overflow:hidden}
.canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab;background-image:radial-gradient(var(--grid) 1px,transparent 1px);background-size:22px 22px}
.canvas.dragging{cursor:grabbing}
.tools{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;display:flex;gap:6px}
.tool{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px}
.legend{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;display:flex;flex-wrap:wrap;gap:6px 12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11px;color:var(--muted);max-width:calc(100% - 140px)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend svg{flex:none}

/* graph nodes (HTML inside foreignObject) */
.mnode{box-sizing:border-box;height:100%;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 9px;display:flex;flex-direction:column;gap:5px;cursor:pointer;font-family:var(--f-body)}
.mnode.hot{border-width:1.5px;border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.mnode.sel{outline:2px solid var(--accent);outline-offset:1px}
.mnode.dim{opacity:.32}
.mnode .row{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.mnode .nm{font-family:var(--f-mono);font-weight:600;font-size:13px}
.mnode .cr{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.bar{display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--grid)}
.bar i{display:block;height:100%}
.mnode .ct{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inode{box-sizing:border-box;height:100%;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 9px 6px 11px;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.inode::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--stc)}
.inode.closed{opacity:.55}
.inode.sel{outline:2px solid var(--accent);outline-offset:1px}
.inode .top{display:flex;justify-content:space-between;gap:6px;font-size:10.5px;font-family:var(--f-mono);color:var(--muted)}
.inode .top b{color:var(--stc);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.inode .t{font-size:12px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
svg text.band{font-family:var(--f-body);font-size:10.5px;font-weight:600;letter-spacing:.08em;fill:var(--muted)}
svg text.elabel{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}

/* work view loose lane */
#work{display:flex;flex-direction:column}
#work .graphwrap{flex:1;min-height:0;position:relative}
.loose{border-top:1px solid var(--line);background:var(--panel);max-height:34%;overflow:auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.loose h3{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--muted)}
.loose h3 b{color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}

/* next board */
#next{overflow:auto}
.board{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:min(100%,1180px)}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.col h2{font-family:var(--f-display);font-size:13px;font-weight:700;margin:0;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.06em}
.col h2 .n{font-family:var(--f-mono);color:var(--muted);font-weight:500}
.col p.hint{margin:0 0 4px;font-size:11.5px;color:var(--muted);line-height:1.4}
.card{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 10px 9px 13px;cursor:pointer;position:relative;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%;box-sizing:border-box}
.card::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--stc)}
.card .top{display:flex;justify-content:space-between;gap:6px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.card .t{font-weight:600;font-size:13px;line-height:1.3}
.card .meta{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-family:var(--f-mono);font-size:10.5px;padding:1px 6px;border-radius:4px;background:var(--grid);color:var(--muted)}
.tag.unb{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tag.blk{color:var(--st-waiting)}

/* drawer */
aside#drawer{width:400px;max-width:100%;border-left:1px solid var(--line);background:var(--panel);overflow:auto;display:flex;flex-direction:column}
aside#drawer[hidden]{display:none!important}
.dhead{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;align-items:flex-start;z-index:1}
.dhead h2{font-family:var(--f-display);font-size:16px;margin:0;line-height:1.3;flex:1;text-wrap:balance}
.dhead .close{border:1px solid var(--line);background:transparent;border-radius:6px;cursor:pointer;padding:2px 8px}
.dbody{padding:12px 16px 24px;display:flex;flex-direction:column;gap:16px}
.dbody h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 6px;font-weight:600}
.dbody p{margin:0;line-height:1.5;color:var(--ink)}
.dbody .ex{color:var(--muted);font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
ul.links{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
ul.links li{display:flex;gap:8px;align-items:baseline;font-size:13px;line-height:1.35}
ul.links li .n{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);flex:none;min-width:36px}
ul.links button.lk{border:0;background:none;padding:0;text-align:left;cursor:pointer;color:var(--ink)}
ul.links button.lk:hover{color:var(--accent);text-decoration:underline}
.why{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid var(--stc);color:var(--stc)}
.brief{font-family:var(--f-mono);font-size:11.5px;white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;max-height:220px;overflow:auto;margin:0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:12px;font-weight:600;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
@media (max-width:760px){
  .stats{margin-left:0;width:100%}
  aside#drawer{position:absolute;inset:auto 0 0 0;width:auto;max-height:70%;border-left:0;border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.18);z-index:5;padding-bottom:env(safe-area-inset-bottom,0px)}
  .legend{display:none}
  .board{grid-template-columns:1fr;min-width:0}
}
@media (prefers-reduced-motion:no-preference){.mnode,.inode,.card{transition:opacity .15s,border-color .15s}}
</style>

<header>
  <div class="brand"><h1>Construct Work Map</h1><small id="src">loading…</small></div>
  <nav class="views" role="tablist" aria-label="Views">
    <button role="tab" id="tab-system" data-view="system" aria-selected="true">System</button>
    <button role="tab" id="tab-work" data-view="work" aria-selected="false">Work</button>
    <button role="tab" id="tab-next" data-view="next" aria-selected="false">Next</button>
  </nav>
  <div class="stats" id="stats"></div>
</header>
<div class="filterbar" id="filterbar"></div>
<main>
  <section class="view" id="system" aria-label="System view">
    <svg class="canvas" id="sysSvg" role="img" aria-label="Module graph with open issues per module"></svg>
    <div class="legend" id="sysLegend"></div>
    <div class="tools"><button class="tool" id="sysFit">Fit</button></div>
  </section>
  <section class="view" id="work" aria-label="Work view" hidden>
    <div class="graphwrap">
      <svg class="canvas" id="workSvg" role="img" aria-label="Issue dependency graph"></svg>
      <div class="legend" id="workLegend"></div>
      <div class="tools"><button class="tool" id="toggleDone" aria-pressed="false">Show all done</button><button class="tool" id="workFit">Fit</button></div>
    </div>
    <div class="loose" id="loose"></div>
  </section>
  <section class="view" id="next" aria-label="Next view" hidden><div class="board" id="board"></div></section>
  <aside id="drawer" hidden aria-label="Details"></aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js"></script>
<script>
const STAGES = {
  ready:{label:"Ready", hint:"No open blockers, and labelled agent-ready or bug. Hand these to an agent."},
  experiment:{label:"Experiment", hint:"Labelled experiment: run it, record the result, then decide."},
  decide:{label:"Decide", hint:"Labelled question: needs your call, usually an ADR."},
  shape:{label:"Shape", hint:"Open with no stage signal yet: flesh out, label, or link dependencies."},
  waiting:{label:"Waiting", hint:"Something it depends on is still open."},
  done:{label:"Done", hint:"Closed as completed."},
  dropped:{label:"Dropped", hint:"Closed as not planned."},
};
const BOARD = ["ready","experiment","decide","shape","waiting"];
const sc = s => `var(--st-${s})`;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id);

let G, byN = {}, modById = {}, view = "system", area = null, showDone = false, selected = null;

fetch("graph.json").then(r => r.json()).then(g => { G = g; init(); }).catch(e => {
  $("system").innerHTML = `<div class="empty">Couldn't load graph.json (${esc(e.message)}). Re-run build.py and publish again.</div>`;
});

function init(){
  G.issues.forEach(i => byN[i.n] = i);
  G.modules.forEach(m => modById[m.id] = m);
  // per-module rollups
  G.modules.forEach(m => { m.open = []; m.features = []; m.adrs = []; });
  G.issues.forEach(i => i.state === "open" && i.areas.forEach(a => modById[a] && modById[a].open.push(i)));
  G.features.forEach(f => f.areas.forEach(a => modById[a] && modById[a].features.push(f)));
  G.adrs.forEach(d => d.areas.forEach(a => modById[a] && modById[a].adrs.push(d)));
  // edges as the user reads them: prerequisite -> dependent
  G.issues.forEach(i => { i.down = []; i.parts = []; i.parent = null; });
  G.edges.forEach(e => {
    if (!byN[e.from] || !byN[e.to]) return;
    if (e.rel === "after") byN[e.to].down.push(e);
    else { byN[e.to].parts.push(e); byN[e.from].parent = e.to; }
  });

  const open = G.issues.filter(i => i.state === "open");
  const linked = new Set(); G.edges.forEach(e => { linked.add(e.from); linked.add(e.to); });
  const nat = G.edges.filter(e => e.kind === "native").length;
  $("src").textContent = `${G.repo} @ ${G.sha} · built ${G.generated.replace("T"," ")}`;
  $("stats").innerHTML = [
    [open.length,"open"],
    [open.filter(i => i.stage === "ready").length,"ready"],
    [open.filter(i => i.stage === "waiting").length,"waiting"],
    [`${nat}/${G.edges.length - nat}`,"native/inferred links"],
    [open.filter(i => !linked.has(i.n)).length,"open with no links"],
  ].map(([n,l]) => `<span><b>${n}</b> ${l}</span>`).join("");

  document.querySelectorAll("nav.views button").forEach(b => b.addEventListener("click", () => setView(b.dataset.view, true)));
  $("toggleDone").addEventListener("click", () => { showDone = !showDone; $("toggleDone").setAttribute("aria-pressed", showDone); $("toggleDone").textContent = showDone ? "Hide unlinked done" : "Show all done"; renderWork(); });
  window.addEventListener("hashchange", fromHash);
  legends();
  window.addEventListener("resize", () => { if (view === "system") sysPZ.fit(); if (view === "work" && workPZ) workPZ.fit(); });
  buildSystem();
  fromHash();
}

function fromHash(){
  const h = location.hash.slice(1);
  setView(["system","work","next"].includes(h) ? h : "system", false);
}
function setView(v, push){
  view = v;
  if (push && location.hash.slice(1) !== v) history.replaceState(null, "", "#" + v);
  document.querySelectorAll("nav.views button").forEach(b => b.setAttribute("aria-selected", b.dataset.view === v));
  ["system","work","next"].forEach(id => $(id).hidden = id !== v);
  renderFilter();
  if (v === "work") renderWork();
  if (v === "next") renderBoard();
  if (v === "system"){ paintSystem(); requestAnimationFrame(() => sysPZ && sysPZ.fit()); }
}
function setArea(a){ area = a; renderFilter(); if (view === "work") renderWork(); if (view === "next") renderBoard(); paintSystem(); }

function renderFilter(){
  const fb = $("filterbar");
  const parts = [];
  if (view === "system") parts.push(`<span>Modules from <span class="mono">docs/architecture.toml</span>; a line means "may use". Open issues sit on the modules their title and body name. Click a module.</span>`);
  if (view === "work") parts.push(`<span>Top to bottom is execution order: a prerequisite sits above what it unblocks. Dashed lines were inferred from issue text; confirm them as GitHub blocked-by links.</span>`);
  if (view === "next") parts.push(`<span>Open issues by stage, most-unblocking first.</span>`);
  if (area) parts.unshift(`<button class="chip" aria-pressed="true" id="clearArea">area: <b class="mono">${esc(modById[area]?.label || area)}</b> <span class="x" aria-hidden="true">✕</span><span hidden>clear</span></button>`);
  fb.innerHTML = parts.join("");
  const c = $("clearArea"); if (c) c.addEventListener("click", () => setArea(null));
}

function legends(){
  const sw = s => `<span><i class="dot" style="background:${sc(s)}"></i>${STAGES[s].label}</span>`;
  $("sysLegend").innerHTML = BOARD.map(sw).join("") + `<span>bar = open issues by stage</span>`;
  $("workLegend").innerHTML = BOARD.map(sw).join("") + sw("done") +
    `<span><svg width="26" height="6"><line x1="0" y1="3" x2="26" y2="3" stroke="var(--ink)" stroke-width="1.5"/></svg>GitHub link</span>` +
    `<span><svg width="26" height="6"><line x1="0" y1="3" x2="26" y2="3" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 3"/></svg>inferred</span>` +
    `<span><svg width="26" height="6"><line x1="0" y1="3" x2="26" y2="3" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="1 3"/></svg>part of</span>`;
}

/* ---------- pan / zoom ---------- */
function panZoom(svg, mode){
  const st = {x:0,y:0,w:1000,h:800};
  const apply = () => svg.setAttribute("viewBox", `${st.x} ${st.y} ${st.w} ${st.h}`);
  let drag = null;
  svg.addEventListener("pointerdown", e => { if (e.target.closest(".mnode,.inode")) return; drag = {x:e.clientX,y:e.clientY,sx:st.x,sy:st.y}; svg.setPointerCapture(e.pointerId); svg.classList.add("dragging"); });
  svg.addEventListener("pointermove", e => { if (!drag) return; const k = st.w / svg.clientWidth; st.x = drag.sx - (e.clientX - drag.x) * k; st.y = drag.sy - (e.clientY - drag.y) * k; apply(); });
  const end = () => { drag = null; svg.classList.remove("dragging"); };
  svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", end);
  svg.addEventListener("wheel", e => {
    e.preventDefault();
    const r = svg.getBoundingClientRect(), k = Math.exp(e.deltaY * 0.0015);
    const px = st.x + (e.clientX - r.left) / r.width * st.w, py = st.y + (e.clientY - r.top) / r.height * st.h;
    st.w *= k; st.h *= k; st.x = px - (px - st.x) * k; st.y = py - (py - st.y) * k; apply();
  }, {passive:false});
  return {
    fit(bw, bh){
      if (bw !== undefined){ this.bw = bw; this.bh = bh; } else { bw = this.bw; bh = this.bh; }
      const r = svg.getBoundingClientRect(); const pad = 30;
      if (bw === undefined || r.width < 10 || r.height < 10) return;
      const sx = (bw + pad*2) / Math.max(r.width,1), sy = (bh + pad*2) / Math.max(r.height,1);
      const s = mode === "width" ? Math.max(sx, 0.75) : Math.max(sx, sy, 0.6);
      st.w = r.width * s; st.h = r.height * s; st.x = -pad - (st.w - bw - pad*2)/2; st.y = st.h < bh + pad*2 ? -pad : -pad - (st.h - bh - pad*2)/2; apply();
    }
  };
}

function edgePath(pts){
  let d = `M${pts[0].x},${pts[0].y}`;
  for (let i = 1; i < pts.length - 1; i++){
    const mx = (pts[i].x + pts[i+1].x)/2, my = (pts[i].y + pts[i+1].y)/2;
    d += ` Q${pts[i].x},${pts[i].y} ${i === pts.length - 2 ? pts[i+1].x + "," + pts[i+1].y : mx + "," + my}`;
  }
  if (pts.length === 2) d += ` L${pts[1].x},${pts[1].y}`;
  return d;
}
const NS = "http://www.w3.org/2000/svg";
function marker(svg, id, color){
  return `<marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="${color}"/></marker>`;
}

/* ---------- system view ---------- */
let sysPZ;
function stageBar(list){
  const n = list.length || 1;
  return `<div class="bar">${BOARD.map(s => { const c = list.filter(i => i.stage === s).length; return c ? `<i style="width:${c/n*100}%;background:${sc(s)}" title="${c} ${STAGES[s].label}"></i>` : ""; }).join("")}</div>`;
}
function buildSystem(){
  const svg = $("sysSvg");
  const W = 176, H = 70;
  // bands by role, top (what users touch) to bottom (what everything stands on)
  const BANDS = [
    ["Front ends", ["cli","tui","acp"]],
    ["The loop", ["agent","child","agents","jobs","prompt","router","context","compact"]],
    ["Tools and the boundary", ["tools","mcp","permission","sandbox"]],
    ["Learning and knowledge", ["learn","skills","memory","jev","guard"]],
    ["Talking to models", ["llm","providers","models","endpoint","http"]],
    ["The record", ["journal","event","manifest"]],
    ["Foundation", []],
    ["Tooling, outside the shipped crates", ["bench","dev","workspace"]],
  ];
  const placed = new Set(BANDS.flatMap(b => b[1]));
  BANDS[6][1] = G.modules.map(m => m.id).filter(id => !placed.has(id));
  const pos = {}, GAP = 18, COLS = 8;
  const fullW = COLS * W + (COLS - 1) * GAP;
  let y = 0; const bandY = [];
  BANDS.forEach(([label, ids]) => {
    ids = ids.filter(id => modById[id]);
    if (!ids.length) return;
    bandY.push([label, y]); y += 22;
    for (let k = 0; k < ids.length; k += COLS){
      const chunk = ids.slice(k, k + COLS);
      chunk.forEach((id, c) => pos[id] = {x: c * (W + GAP) + W/2, y: y + H/2});
      y += H + 18;
    }
    y += 26;
  });
  const gg = {width: fullW, height: y - 26};
  let html = `<defs>${marker(svg,"mA","var(--edge)")}${marker(svg,"mB","var(--edge-hi)")}</defs>`;
  bandY.forEach(([label, by]) => { html += `<text class="band" x="0" y="${by + 12}">${esc(label.toUpperCase())}</text><line x1="0" x2="${fullW}" y1="${by + 17}" y2="${by + 17}" stroke="var(--line)"/>`; });
  html += `<g id="sysEdges">`;
  G.module_edges.forEach(([a2,b2]) => {
    const p = pos[a2], q = pos[b2]; if (!p || !q) return;
    const down = q.y > p.y, sy = down ? p.y + H/2 : p.y - H/2, ty = down ? q.y - H/2 : q.y + H/2;
    const same = Math.abs(q.y - p.y) < 1;
    const d = same ? `M${p.x},${p.y + H/2} C${p.x},${p.y + H/2 + 30} ${q.x},${q.y + H/2 + 30} ${q.x},${q.y + H/2}`
      : `M${p.x},${sy} C${p.x},${(sy+ty)/2} ${q.x},${(sy+ty)/2} ${q.x},${ty}`;
    html += `<path data-a="${a2}" data-b="${b2}" d="${d}" fill="none" stroke="var(--edge)" stroke-width="1" marker-end="url(#mA)"/>`;
  });
  html += `</g><g id="sysNodes">`;
  G.modules.forEach(m => {
    const n = pos[m.id];
    const ver = m.features.filter(f => f.status === "verified").length;
    const ct = [`${m.open.length} open`, m.features.length ? `${ver}/${m.features.length} feat` : "", m.adrs.length ? `${m.adrs.length} ADR` : ""].filter(Boolean).join(" · ");
    html += `<foreignObject x="${n.x - W/2}" y="${n.y - H/2}" width="${W}" height="${H}"><div xmlns="http://www.w3.org/1999/xhtml" class="mnode${m.open.length >= 3 ? " hot" : ""}" data-m="${m.id}" tabindex="0" role="button" aria-label="${esc(m.label)}: ${esc(ct)}">
      <div class="row"><span class="nm">${esc(m.label)}</span><span class="cr">${esc(m.crate.replace("construct-",""))}</span></div>
      ${stageBar(m.open)}<div class="ct">${esc(ct)}</div></div></foreignObject>`;
  });
  svg.innerHTML = html + `</g>`;
  sysPZ = panZoom(svg, "width");
  requestAnimationFrame(() => sysPZ.fit(gg.width, gg.height));
  $("sysFit").addEventListener("click", () => sysPZ.fit(gg.width, gg.height));
  svg.addEventListener("click", e => { const n = e.target.closest(".mnode"); if (n) openModule(n.dataset.m); });
  svg.addEventListener("keydown", e => { const n = e.target.closest(".mnode"); if (n && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); openModule(n.dataset.m); } });
  svg.addEventListener("pointerover", e => { const n = e.target.closest(".mnode"); hiModule(n ? n.dataset.m : area); });
  svg.addEventListener("pointerleave", () => hiModule(area));
}
function hiModule(id){
  const near = new Set(id ? [id] : []);
  document.querySelectorAll("#sysEdges path").forEach(p => {
    const on = id && (p.dataset.a === id || p.dataset.b === id);
    if (on){ near.add(p.dataset.a); near.add(p.dataset.b); }
    p.setAttribute("stroke", on ? "var(--edge-hi)" : "var(--edge)");
    p.setAttribute("stroke-width", on ? 1.8 : 1);
    p.setAttribute("marker-end", on ? "url(#mB)" : "url(#mA)");
    p.style.opacity = on ? 1 : id ? .12 : .35;
  });
  document.querySelectorAll(".mnode").forEach(n => n.classList.toggle("dim", !!id && !near.has(n.dataset.m)));
}
function paintSystem(){
  document.querySelectorAll(".mnode").forEach(n => n.classList.toggle("sel", n.dataset.m === area));
  hiModule(area);
}

/* ---------- work view ---------- */
let workPZ;
function inArea(i){ return !area || i.areas.includes(area); }
function renderWork(){
  const svg = $("workSvg");
  const linked = new Map();
  G.edges.forEach(e => { if (byN[e.from] && byN[e.to]) { linked.set(e.from, true); linked.set(e.to, true); } });
  // nodes: issues on a link, where the link touches an open issue (or any, with "show all done"), in the area filter
  const keepEdge = e => byN[e.from] && byN[e.to] && (showDone || byN[e.from].state === "open" || byN[e.to].state === "open");
  let edges = G.edges.filter(keepEdge);
  if (area){ const hit = new Set(G.issues.filter(inArea).map(i => i.n)); edges = edges.filter(e => hit.has(e.from) || hit.has(e.to)); }
  const ns = new Set(); edges.forEach(e => { ns.add(e.from); ns.add(e.to); });
  const W = 230, H = 62;
  if (!ns.size){ svg.innerHTML = ""; }
  else {
    // one dagre layout per connected chain, then shelf-pack the chains into rows
    const comp = new Map(); let cid = 0;
    const adj = new Map(); ns.forEach(n => adj.set(n, []));
    edges.forEach(e => { adj.get(e.from).push(e.to); adj.get(e.to).push(e.from); });
    [...ns].sort((a,b) => a-b).forEach(n => { if (comp.has(n)) return; const st = [n]; comp.set(n, cid); while (st.length){ const x = st.pop(); adj.get(x).forEach(y => { if (!comp.has(y)){ comp.set(y, cid); st.push(y); } }); } cid++; });
    const blocks = [];
    for (let c = 0; c < cid; c++){
      const g = new dagre.graphlib.Graph({multigraph:true}); g.setGraph({rankdir:"TB", nodesep:22, ranksep:46, marginx:0, marginy:0}); g.setDefaultEdgeLabel(() => ({}));
      ns.forEach(n => comp.get(n) === c && g.setNode(String(n), {width:W, height:H}));
      edges.forEach((e,k) => comp.get(e.from) === c && g.setEdge(String(e.to), String(e.from), {e}, "k"+k));
      dagre.layout(g);
      const open = g.nodes().filter(n => byN[n].state === "open").length;
      blocks.push({g, w: g.graph().width, h: g.graph().height, open, size: g.nodeCount()});
    }
    blocks.sort((a,b) => (b.open - a.open) || (b.size - a.size));
    const r = svg.getBoundingClientRect();
    const target = Math.max(W * 3 + 80, Math.min(W * 7 + 240, (r.width || 1200) * 1.25));
    let cx = 0, cy = 0, rowH = 0, maxW = 0; const BG = 56;
    blocks.forEach(b => { if (cx > 0 && cx + b.w > target){ cx = 0; cy += rowH + BG; rowH = 0; } b.ox = cx; b.oy = cy; cx += b.w + BG; rowH = Math.max(rowH, b.h); maxW = Math.max(maxW, b.ox + b.w); });
    const gg = {width: maxW, height: cy + rowH};
    let html = `<defs>${marker(svg,"wA","var(--ink)")}${marker(svg,"wP","var(--muted)")}</defs>`;
    blocks.forEach(({g, ox, oy}) => {
      g.edges().forEach(ed => {
        const {e, points} = g.edge(ed);
        const part = e.rel === "part";
        html += `<path transform="translate(${ox},${oy})" d="${edgePath(points)}" fill="none" stroke="${part ? "var(--muted)" : "var(--ink)"}" stroke-opacity="${part ? .7 : .55}" stroke-width="1.4" ${part ? 'stroke-dasharray="1 4" stroke-linecap="round"' : e.kind === "inferred" ? 'stroke-dasharray="5 4"' : ""} marker-end="url(#${part ? "wP" : "wA"})"><title>#${e.from} ${part ? "is part of" : "waits on"} #${e.to} (${e.kind}): ${esc(e.why)}</title></path>`;
      });
      g.nodes().forEach(n => { const p = g.node(n); html += `<foreignObject x="${ox + p.x - W/2}" y="${oy + p.y - H/2}" width="${W}" height="${H}">${inode(byN[n], true)}</foreignObject>`; });
    });
    svg.innerHTML = html;
    if (!workPZ){ workPZ = panZoom(svg, "width"); svg.addEventListener("click", e => { const n = e.target.closest(".inode"); if (n) openIssue(+n.dataset.n); }); svg.addEventListener("keydown", e => { const n = e.target.closest(".inode"); if (n && e.key === "Enter") openIssue(+n.dataset.n); }); }
    requestAnimationFrame(() => workPZ.fit(gg.width, gg.height));
    $("workFit").onclick = () => workPZ.fit(gg.width, gg.height);
  }
  const loose = G.issues.filter(i => i.state === "open" && !linked.has(i.n) && inArea(i)).sort(rank);
  $("loose").innerHTML = `<h3><b>${loose.length}</b> open issue${loose.length === 1 ? "" : "s"} with no recorded dependency${area ? " in this area" : ""}. Link them, or confirm they stand alone.</h3><div class="cards">${loose.map(card).join("")}</div>`;
  bindCards($("loose"));
}
function inode(i, xmlns){
  return `<div ${xmlns ? 'xmlns="http://www.w3.org/1999/xhtml"' : ""} class="inode${i.state === "closed" ? " closed" : ""}${selected === i.n ? " sel" : ""}" data-n="${i.n}" tabindex="0" role="button" style="--stc:${sc(i.stage)}">
    <div class="top"><span>#${i.n}${i.areas.length ? " · " + esc(i.areas.slice(0,2).join(", ")) : ""}</span><b>${STAGES[i.stage].label}</b></div><div class="t">${esc(i.title)}</div></div>`;
}

/* ---------- next board ---------- */
const rank = (a,b) => (b.unblocks - a.unblocks) || (a.created < b.created ? -1 : 1);
function card(i){
  const ob = i.open_blockers.length;
  return `<button class="card" data-n="${i.n}" style="--stc:${sc(i.stage)}">
    <span class="top"><span>#${i.n}</span><span>${i.created}</span></span>
    <span class="t">${esc(i.title)}</span>
    <span class="meta">${i.unblocks ? `<span class="tag unb">unblocks ${i.unblocks}</span>` : ""}${ob ? `<span class="tag blk">waits on ${i.open_blockers.map(n => "#"+n).join(" ")}</span>` : ""}${i.areas.map(a => `<span class="tag">${esc(a)}</span>`).join("")}</span></button>`;
}
function bindCards(root){ root.querySelectorAll(".card").forEach(c => c.addEventListener("click", () => openIssue(+c.dataset.n))); }
function renderBoard(){
  const open = G.issues.filter(i => i.state === "open" && inArea(i));
  $("board").innerHTML = BOARD.map(s => { const l = open.filter(i => i.stage === s).sort(rank);
    return `<div class="col"><h2><i class="dot" style="background:${sc(s)}"></i>${STAGES[s].label} <span class="n">${l.length}</span></h2><p class="hint">${STAGES[s].hint}</p>${l.map(card).join("") || `<p class="hint">Nothing here${area ? " in this area" : ""}.</p>`}</div>`; }).join("");
  bindCards($("board"));
}

/* ---------- drawer ---------- */
function drawer(html){ const d = $("drawer"); d.innerHTML = html; d.hidden = false; d.scrollTop = 0; d.querySelector(".close").addEventListener("click", closeDrawer);
  d.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => openIssue(+b.dataset.open)));
  d.querySelectorAll("[data-area]").forEach(b => b.addEventListener("click", () => { setArea(b.dataset.area); if (b.dataset.go) setView(b.dataset.go, true); }));
}
function closeDrawer(){ $("drawer").hidden = true; selected = null; document.querySelectorAll(".inode.sel").forEach(n => n.classList.remove("sel")); }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
const ilink = (n, extra="") => { const i = byN[n]; return `<li><span class="n">#${n}</span><span><button class="lk" data-open="${n}">${esc(i ? i.title : "")}</button> <span class="tag" style="color:${sc(i?.stage||"shape")}">${i ? STAGES[i.stage].label : ""}</span>${extra}</span></li>`; };

function openModule(id){
  const m = modById[id]; setArea(id);
  const byStage = BOARD.map(s => [s, m.open.filter(i => i.stage === s).sort(rank)]).filter(([,l]) => l.length);
  const uses = G.module_edges.filter(([a]) => a === id).map(([,b]) => b), usedBy = G.module_edges.filter(([,b]) => b === id).map(([a]) => a);
  const path = m.crate === "construct-core" ? `crates/construct-core/src/${id}` : m.crate === "construct-tui" ? "crates/construct-tui/src" : m.crate === "construct" ? "crates/construct/src/cli.rs" : "";
  drawer(`<div class="dhead"><h2><span class="mono">${esc(m.label)}</span></h2><button class="close" aria-label="Close">✕</button></div><div class="dbody">
    <dl class="kv"><dt>Crate</dt><dd class="mono">${esc(m.crate)}</dd>${path ? `<dt>Source</dt><dd class="mono">${esc(path)}</dd>` : ""}
    ${m.submodules.length ? `<dt>Modules</dt><dd class="mono">${m.submodules.length}: ${esc(m.submodules.join(", "))}</dd>` : ""}
    ${uses.length ? `<dt>Uses</dt><dd class="mono">${esc(uses.join(", "))}</dd>` : ""}${usedBy.length ? `<dt>Used by</dt><dd class="mono">${esc(usedBy.join(", "))}</dd>` : ""}</dl>
    <div class="btnrow"><button class="btn primary" data-area="${id}" data-go="work">Dependency graph for ${esc(m.label)}</button><button class="btn" data-area="${id}" data-go="next">Board for ${esc(m.label)}</button></div>
    <div><h3>Open issues · ${m.open.length}</h3>${byStage.length ? byStage.map(([s,l]) => `<ul class="links">${l.map(i => ilink(i.n, i.unblocks ? ` <span class="tag unb">unblocks ${i.unblocks}</span>` : "")).join("")}</ul>`).join("") : `<p class="ex">No open issues mention this module.</p>`}</div>
    ${m.features.length ? `<div><h3>Features · ${m.features.length}</h3><ul class="links">${m.features.map(f => `<li><span class="n">${esc(f.status)}</span><span>${esc(f.title)}${f.verified_at ? ` <span class="why">verified at ${esc(f.verified_at.slice(0,7))}</span>` : ""}</span></li>`).join("")}</ul></div>` : ""}
    ${m.adrs.length ? `<div><h3>Decisions · ${m.adrs.length}</h3><ul class="links">${m.adrs.map(d => `<li><span class="n">${d.id}</span><span>${esc(d.title.replace(/^\d{4}\s*[—-]\s*/,""))}${d.status !== "accepted" ? ` <span class="tag" style="color:var(--st-decide)">${esc(d.status)}</span>` : ""}</span></li>`).join("")}</ul></div>` : ""}
  </div>`);
}

function openIssue(n){
  const i = byN[n]; if (!i) return; selected = n;
  document.querySelectorAll(".inode").forEach(x => x.classList.toggle("sel", +x.dataset.n === n));
  const blockers = G.edges.filter(e => e.from === n && e.rel === "after");
  const downs = i.down;
  const adrs = G.adrs.filter(d => d.implements.includes(n) || d.refs.includes(n));
  const children = i.parts.map(e => e.from);
  const brief = makeBrief(i, blockers, adrs);
  const how = {ready:"No open blockers, labelled " + (i.labels.includes("bug") ? "bug" : "agent-ready") + ".", experiment:"Labelled experiment, no open blockers.", decide:"Labelled question.", shape:"No stage label and no open blockers.", waiting:`Waits on open ${i.open_blockers.map(x=>"#"+x).join(", ")}.`, done:"Closed as completed.", dropped:"Closed as not planned."}[i.stage];
  drawer(`<div class="dhead"><h2>${esc(i.title)}</h2><button class="close" aria-label="Close">✕</button></div><div class="dbody">
    <div class="btnrow"><span class="pill" style="--stc:${sc(i.stage)}"><i class="dot" style="background:${sc(i.stage)}"></i>${STAGES[i.stage].label}</span><a class="btn" href="${esc(i.url)}" target="_blank" rel="noopener">#${i.n} on GitHub ↗</a></div>
    <dl class="kv"><dt>Why this stage</dt><dd>${esc(how)}</dd><dt>Opened</dt><dd class="mono">${i.created}${i.closed ? " · closed " + i.closed : ""}</dd>
      ${i.labels.length ? `<dt>Labels</dt><dd>${i.labels.map(l => `<span class="tag">${esc(l)}</span>`).join(" ")}</dd>` : ""}
      <dt>Areas</dt><dd>${i.areas.length ? i.areas.map(a => `<button class="chip" data-area="${a}" data-go="work">${esc(a)}</button>`).join(" ") : `<span class="ex">none matched</span>`}</dd>
      ${i.prs.length ? `<dt>Closed by</dt><dd class="mono">${i.prs.map(p => `<a href="https://github.com/${G.repo}/pull/${p}" target="_blank" rel="noopener">PR ${p}</a>`).join(", ")}</dd>` : ""}</dl>
    ${i.excerpt ? `<p class="ex">${esc(i.excerpt)}${i.excerpt.length >= 320 ? "…" : ""}</p>` : ""}
    <div><h3>Waits on · ${blockers.length}</h3>${blockers.length ? `<ul class="links">${blockers.map(e => ilink(e.to, `<span class="why">${e.kind}: “${esc(e.why)}”</span>`)).join("")}</ul>` : `<p class="ex">Nothing recorded.</p>`}</div>
    <div><h3>Unblocks · ${downs.length} direct, ${i.unblocks} open downstream</h3>${downs.length ? `<ul class="links">${downs.map(e => ilink(e.from, `<span class="why">${e.kind}: “${esc(e.why)}”</span>`)).join("")}</ul>` : `<p class="ex">Nothing recorded.</p>`}</div>
    ${i.parent ? `<div><h3>Part of</h3><ul class="links">${ilink(i.parent)}</ul></div>` : ""}
    ${children.length ? `<div><h3>Sub-issues · ${children.length}</h3><ul class="links">${children.map(c => ilink(c)).join("")}</ul></div>` : ""}
    ${adrs.length ? `<div><h3>Decisions</h3><ul class="links">${adrs.map(d => `<li><span class="n">${d.id}</span><span>${esc(d.title.replace(/^\d{4}\s*[—-]\s*/,""))}</span></li>`).join("")}</ul></div>` : ""}
    ${i.related.length ? `<div><h3>Mentions</h3><p class="ex mono">${i.related.map(r => `<button class="lk btn" data-open="${r}" style="padding:1px 6px;margin:0 4px 4px 0">#${r}</button>`).join("")}</p></div>` : ""}
    ${i.state === "open" ? `<div><h3>Agent brief</h3><pre class="brief" id="brief">${esc(brief)}</pre><div class="btnrow" style="margin-top:8px"><button class="btn primary" id="copyBrief">Copy brief</button><span class="ex" id="copied" aria-live="polite"></span></div></div>` : ""}
  </div>`);
  const cb = $("copyBrief");
  if (cb) cb.addEventListener("click", () => {
    navigator.clipboard.writeText(brief).then(() => $("copied").textContent = "Copied", () => { const r = document.createRange(); r.selectNodeContents($("brief")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); $("copied").textContent = "Selected: press copy"; });
  });
}

function makeBrief(i, blockers, adrs){
  const done = blockers.filter(e => byN[e.to].state === "closed"), open = blockers.filter(e => byN[e.to].state === "open");
  const paths = i.areas.map(a => { const m = modById[a]; return m?.crate === "construct-core" ? `crates/construct-core/src/${a}` : m?.crate === "construct-tui" ? "crates/construct-tui/src" : a === "bench" ? "bench/" : a === "dev" ? "crates/construct-dev/" : a; });
  const L = [`Work on ${G.repo}#${i.n}: ${i.title}`, i.url, "", `Stage: ${STAGES[i.stage].label}. ${STAGES[i.stage].hint}`];
  if (paths.length) L.push(`Likely area: ${paths.join(", ")}`);
  if (done.length) L.push("", "Finished prerequisites (read their outcome first):", ...done.map(e => `- #${e.to} ${byN[e.to].title}`));
  if (open.length) L.push("", "Still open prerequisites (do not build past them):", ...open.map(e => `- #${e.to} ${byN[e.to].title}`));
  if (adrs.length) L.push("", "Decisions that apply:", ...adrs.map(d => `- docs/adr/${d.file}`));
  L.push("", i.stage === "experiment" ? "Run the experiment, record the numbers in the issue, and propose the decision. Don't ship the feature yet." :
    i.stage === "decide" ? "Lay out the options with evidence and a recommendation. Write the ADR draft; don't implement." :
    i.stage === "shape" ? "Read the issue and code, then propose scope, dependencies on other issues, and a stage label. Don't implement yet." :
    "Implement it following AGENTS.md; run cargo xtask check --quick and the e2e tests the change can reach.");
  return L.join("\n");
}
</script>
