# cargo-about: builds THIRD-PARTY-LICENSES.txt for release archives
# (.github/workflows/release.yml). The license list mirrors deny.toml, which
# is the policy; this file only renders the notices.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "MPL-2.0", # colored only; see deny.toml
]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
ignore-build-dependencies = false
ignore-dev-dependencies = true
private = { ignore = true }
