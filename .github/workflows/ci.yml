name: ci
on:
  push: { branches: [main] }
  pull_request: {}
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CONSTRUCT_E2E_SLOW: "1"
    steps:
      - uses: actions/checkout@v4
        # full history: the rust-replay bench tasks are trees at past commits
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      # A pull request runs only the tests its diff reaches (ADR 0054,
      # crates/construct-dev/tests/affected.toml); a push to main runs all of
      # them, and is the net under an area that claims too little.
      - run: cargo xtask check ${{ github.event_name == 'pull_request' && '--affected' || '' }}
  # The same gates on a Mac: the Seatbelt sandbox and everything that touches
  # the OS (ADR 0028), narrowed the same way on a pull request. Without the
  # `bench` gate: it is Python tests that clean up git temp dirs, which race
  # with git's background gc on macOS, and the bench is no part of what ships.
  check-macos:
    runs-on: macos-15
    env:
      CONSTRUCT_E2E_SLOW: "1"
      # The TUI e2e tests drive a real pty and wait on rendered text. Three
      # concurrent drivers on a hosted runner's cores miss 3-6 s waits with
      # no bug in the test (each retry lands on a different test), so cap
      # libtest's parallelism here; the `it` suite alone is ~80 s at 3.
      RUST_TEST_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask check --skip bench ${{ github.event_name == 'pull_request' && '--affected' || '' }}
  # The env-only secrets build (#271, ADR 0051) and the feature bundles
  # (ADR 0063): no keyring feature, no secretspec subtree. Its own job so
  # the features cannot rot unnoticed — the workspace gates above all build
  # with default features.
  check-env-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p construct-core --no-default-features -- -D warnings
      - run: cargo test -p construct-core --no-default-features --lib
      # Bare: no optional feature at all, so a `cfg` around a tool source
      # cannot rot (#271, ADR 0063). Then the lean drop build, smoked below.
      - run: cargo clippy -p construct --no-default-features -- -D warnings
      - run: cargo build -p construct --no-default-features --features lean
      - name: the lean build has its web tools
        run: |
          target/debug/construct manifest | grep -q '"web_search"'
      - name: env resolution works and keyring writes refuse
        run: |
          OPENAI_API_KEY=*** target/debug/construct secrets status | grep -q '✓ OPENAI_API_KEY'
          if target/debug/construct secrets set CONSTRUCT_TEST_KEY v 2>err.txt; then exit 1; fi
          grep -q 'env-only secrets' err.txt
  # Dependency policy (deny.toml). Its own job: it needs the network for the
  # advisory DB, which `cargo xtask check` stays without.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1 (cargo-deny 0.20.2)
        with: { command: check }
