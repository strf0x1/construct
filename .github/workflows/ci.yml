name: ci
on:
  push: { branches: [main] }
  pull_request: {}
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CONSTRUCT_E2E_SLOW: "1"
    steps:
      - uses: actions/checkout@v4
        # full history: the rust-replay bench tasks are trees at past commits
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask check
