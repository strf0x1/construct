name: ci
on:
  push: { branches: [main] }
  pull_request: {}
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CONSTRUCT_E2E_SLOW: "1"
    steps:
      - uses: actions/checkout@v4
        # full history: the rust-replay bench tasks are trees at past commits
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask check
  # Binary-size ratchet (docs/ratchets.toml [binary]). Its own job: a fat-LTO
  # release build takes minutes, which `cargo xtask check` stays without.
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask size
  # Dependency policy (deny.toml). Its own job: it needs the network for the
  # advisory DB, which `cargo xtask check` stays without.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1 (cargo-deny 0.20.2)
        with: { command: check }
