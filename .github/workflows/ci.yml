name: ci
on:
  push: { branches: [main] }
  pull_request: {}
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CONSTRUCT_E2E_SLOW: "1"
    steps:
      - uses: actions/checkout@v4
        # full history: the rust-replay bench tasks are trees at past commits
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask check
  # The same gates on a Mac: the Seatbelt sandbox and everything that touches
  # the OS (ADR 0028). Not `cargo xtask check`: its `bench` gate is Python
  # tests that clean up git temp dirs, which race with git's background gc on
  # macOS, and the bench is no part of what ships.
  check-macos:
    runs-on: macos-15
    env:
      CONSTRUCT_E2E_SLOW: "1"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  # Dependency policy (deny.toml). Its own job: it needs the network for the
  # advisory DB, which `cargo xtask check` stays without.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1 (cargo-deny 0.20.2)
        with: { command: check }
