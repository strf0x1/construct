# The allowed module graph of every workspace crate (crates/*/src) and the
# allowed edges between crates, checked by `cargo xtask check`'s `arch` gate
# (crates/construct-dev/src/arch/). Schema: ADR 0047. It must describe the
# code as it is: an edge not listed here fails, a listed edge that no longer
# occurs fails, and every crate and every top-level module needs an entry.
#
# Each crate is a `[crates.<package>]` section. Within it, a module may name
# another top-level module of the same crate only if it is in that module's
# `may_use`, and the crate may name another workspace crate only if it is in
# `may_use_crates` — so a new dependency is a one-line edit here that shows
# in the diff. Deny rules carry invariants: `must_not_use` / `used_only_by`
# on a module, `must_not_use_crates` / `used_only_by` on a crate. Every deny
# rule needs a `reason`, which the gate prints when the rule is broken.
# A crate deny may name one module of the target crate instead of the whole
# crate (`{ crate = "construct-core", module = "secrets", reason = "…" }`):
# the ban then fires only on paths naming that module, and the module must
# exist in the target crate.
#
# Test code (`#[cfg(test)]`, tests.rs) and a module's references to itself
# are not edges. lib.rs declares every module; declarations are not edges.
# A package's lib and bin roots share one module pool: a path naming the
# package's own lib (`construct_dev::x` in construct-dev) is a module edge, a path
# naming another workspace crate is a crate edge.

[crates.construct]
may_use_crates = ["construct-core", "construct-tui"]

[crates.construct.modules.cli]
may_use = []

[crates.construct.modules.main]
may_use = ["cli"]

[crates.construct-core]
may_use_crates = []

