[crates.construct-core.modules.journal]
may_use = ["child", "config", "context", "event", "jobs", "llm", "project", "skills", "tools"]

[crates.construct-core.modules.learn]
may_use = ["config", "guard", "jev", "journal", "llm", "memory", "project", "router", "sandbox", "secrets", "skills", "text", "tools"]

[crates.construct-core.modules.lib]
may_use = []

[crates.construct-core.modules.llm]
may_use = ["config", "endpoint", "journal", "models", "providers", "text"]

[crates.construct-core.modules.manifest]
may_use = ["config", "llm", "tools"]

[crates.construct-core.modules.mcp]
may_use = ["config", "sandbox", "secrets", "text"]

[crates.construct-core.modules.memory]
may_use = ["config", "guard", "project"]

[crates.construct-core.modules.models]
may_use = ["config", "endpoint", "providers"]

[crates.construct-core.modules.permission]
may_use = ["config", "event", "journal", "sandbox", "tools"]

[crates.construct-core.modules.project]
may_use = ["config"]

[crates.construct-core.modules.prompt]
may_use = ["config", "journal", "learn", "llm", "memory", "skills", "tools"]

[crates.construct-core.modules.providers]
may_use = ["config", "endpoint", "models"]

[crates.construct-core.modules.router]
may_use = ["config", "jev", "llm", "secrets", "skills", "tools"]

[crates.construct-core.modules.sandbox]
may_use = ["agents", "config", "secrets"]

[crates.construct-core.modules.secrets]
may_use = []

[crates.construct-core.modules.skills]
may_use = ["config", "guard", "tools"]

[crates.construct-core.modules.text]
may_use = []

[crates.construct-core.modules.tools]
may_use = ["agents", "child", "config", "event", "jobs", "journal", "llm", "mcp", "memory", "permission", "sandbox", "secrets", "skills", "text"]

[crates.construct-core.modules.trace]
may_use = ["config"]

[crates.construct-core.modules.tui]
may_use = ["agent", "compact", "config", "event", "jobs", "journal", "learn", "llm", "memory", "models", "permission", "project", "skills", "text", "tools", "trace"]
must_not_use = [
  { module = "secrets", reason = "the first frame waits on nothing: no secret resolution on the UI path (AGENTS.md, rules of thumb)" },
  { module = "jev", reason = "no network work on the UI path; routing and learning reach Jev from the agent, never from a draw (AGENTS.md, rules of thumb)" },
  { module = "sandbox", reason = "the UI never spawns or confines processes; tools do that behind the agent, off the UI path" },
]
used_only_by = { modules = [], reason = "the TUI is a front end: nothing in construct-core may use it; only the construct binary starts it (moves to construct-tui in #277)" }
