[crates.construct-tui]
may_use_crates = ["construct-core"]
must_not_use_crates = [
  { crate = "construct-core", module = "secrets", reason = "the first frame waits on nothing: no secret resolution on the UI path (AGENTS.md, rules of thumb)" },
  { crate = "construct-core", module = "jev", reason = "no network work on the UI path; routing and learning reach Jev from the agent, never from a draw (AGENTS.md, rules of thumb)" },
  { crate = "construct-core", module = "sandbox", reason = "the UI never spawns or confines processes; tools do that behind the agent, off the UI path" },
]
used_only_by = { crates = ["construct"], reason = "the TUI is a front end: the agent and everything under it must run without a terminal (`construct run --json`, children, the learner); construct's cli is the one place that chooses to start it" }

