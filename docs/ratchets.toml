# Known debt, counted exactly by `cargo xtask check`'s `arch` gate
# (crates/construct-dev/src/arch/ratchet.rs). A count that grows fails; a
# count that drops fails too until its baseline is lowered here, so each
# improvement is locked in by the PR that made it. Test code never counts.

# Non-test lines of each file under crates/*/src over the 300-line soft
# ceiling (AGENTS.md convention 3). A file that drops under it leaves this
# list; a new file over it fails until it is split or listed here.
[lines]
"crates/construct-dev/src/drive.rs" = 458
"crates/construct-dev/src/serve/mod.rs" = 432
"crates/construct-dev/src/style.rs" = 375
"crates/construct-core/src/agent.rs" = 330
"crates/construct-core/src/compact/mod.rs" = 303
"crates/construct-hub/src/remote.rs" = 320
"crates/construct-tui/src/markdown.rs" = 336

# Module pairs that use each other both ways, per crate (`a <-> b`),
# found by the same scan as `construct-dev code-graph`. A new pair fails the
# `arch` gate naming it; a pair that is cut fails until it is deleted here.
# Modularity plan: issue #303.
[pairs]
construct-core = [
    # Intended (ADR 0057): Config's fields use these modules' types, and
    # they add `impl Config` blocks. Cut only the dependency, not the path.
    "config <-> models",
    "config <-> providers",
]
construct-tui = [
    "app <-> ask",
    "app <-> sessions",
    "palette <-> picker",
]

# Every group of three or more modules joined into one cycle, per crate (a
# strongly connected component, names sorted), from the same scan. Pairs
# alone miss a loop like `a -> b -> c -> a`; this catches it (ADR 0062). A cycle that
# grows, merges or appears fails; one that shrinks, splits or goes fails
# until it is updated here.
[cycles]
# Intended (ADR 0057, 0060): config resolution.
construct-core = ["config, endpoint, models, providers"]
construct-tui = ["app, ask, sessions"]
