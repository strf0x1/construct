[package]
name = "construct"
description = "A lean, self-improving agent harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
sha2 = "0.10"
clap.workspace = true
crossterm = { version = "0.29", features = ["event-stream"] }
futures.workspace = true
globset = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
htmd = "0.5"
ignore = "0.4"
libc = "0.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
reqwest = { workspace = true, features = ["gzip", "query", "form"] }
secretspec = { version = "0.21", default-features = false, features = ["keyring"] }
serde.workspace = true
serde_json.workspace = true
similar = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "sync", "time", "signal"] }
toml = "1"
unicode-width = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
landlock = "0.4"
