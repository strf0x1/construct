[package]
name = "construct"
description = "A lean, self-improving agent harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The composition root (ADR 0048): the sandbox helper re-exec and the CLI.
# Everything testable lives in construct-core; this crate has no tests.
[[bin]]
name = "construct"
path = "src/main.rs"
test = false

[lints]
workspace = true

[features]
default = ["full"]
# Bundles (#271). `full` is every release build. `lean` is the small drop
# build: `--no-default-features --features lean`. Add single features on top
# (`--features lean,keyring`) to measure one at a time.
full = ["keyring", "web", "memory", "skills", "history", "jobs", "deck"]
lean = ["web", "memory", "skills"]
# Forwarded to the engine: off is env-only secrets (ADR 0051). The TUI
# never forces the keyring on.
keyring = ["construct-core/keyring"]
# web_search and web_fetch (construct-tools-web).
web = ["dep:construct-tools-web"]
# recall_result and journal_query (construct-tools-history).
history = ["dep:construct-tools-history"]
# The `job` tool (construct-tools-jobs); background jobs run either way.
jobs = ["dep:construct-tools-jobs"]
# The `memory` tool (construct-tools-memory). The store and its prompt block
# stay in core.
memory = ["dep:construct-tools-memory"]
# `skill` and `skill_manage` (construct-tools-skills). The `review` and
# `curate` learning paths write with these and `memory`; without them they
# end before any model call. `/<skill>` works either way.
skills = ["dep:construct-tools-skills"]
# Deck's tools (construct-deck): `developer`, the boundary tools and the
# coordinator's `deck`, and the boundary client a Deck guest talks through.
# Only a process Deck runs needs it, so `lean` leaves it out.
deck = ["dep:construct-deck"]
# Peer dialer wire protocol (construct-peer, #368): included in stamped peer
# builds, independent of `hub` (#360).
peer = ["dep:construct-peer"]

[dependencies]
construct-core = { workspace = true, default-features = false }
construct-tui.workspace = true
construct-deck = { workspace = true, optional = true }
construct-tools-web = { workspace = true, optional = true }
construct-tools-history = { workspace = true, optional = true }
construct-tools-jobs = { workspace = true, optional = true }
construct-tools-memory = { workspace = true, optional = true }
construct-tools-skills = { workspace = true, optional = true }
construct-peer = { workspace = true, default-features = false, features = ["dial"], optional = true }
anyhow.workspace = true
clap.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
toml.workspace = true
toml_edit.workspace = true
serde_json.workspace = true
