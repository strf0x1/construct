[package]
name = "construct"
description = "A lean, self-improving agent harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The composition root (ADR 0048): the sandbox helper re-exec and the CLI.
# Everything testable lives in construct-core; this crate has no tests.
[[bin]]
name = "construct"
path = "src/main.rs"
test = false

[lints]
workspace = true

[features]
default = ["full"]
# Bundles (#271). `full` is every release build. `lean` is the small drop
# build: `--no-default-features --features lean`. Add single features on top
# (`--features lean,keyring`) to measure one at a time.
full = ["keyring", "web", "history", "jobs"]
lean = ["web"]
# Forwarded to the engine: off is env-only secrets (ADR 0051). The TUI
# never forces the keyring on.
keyring = ["construct-core/keyring"]
# web_search and web_fetch (construct-tools-web).
web = ["dep:construct-tools-web"]
# recall_result and journal_query (construct-tools-history).
history = ["dep:construct-tools-history"]
# The `job` tool (construct-tools-jobs); background jobs run either way.
jobs = ["dep:construct-tools-jobs"]

[dependencies]
construct-core = { workspace = true, default-features = false }
construct-tui.workspace = true
construct-deck.workspace = true
construct-tools-web = { workspace = true, optional = true }
construct-tools-history = { workspace = true, optional = true }
construct-tools-jobs = { workspace = true, optional = true }
anyhow.workspace = true
clap.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
toml.workspace = true
toml_edit.workspace = true
serde_json.workspace = true
