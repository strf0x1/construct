[package]
name = "construct"
description = "A lean, self-improving agent harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The composition root (ADR 0048): the sandbox helper re-exec and the CLI.
# Everything testable lives in construct-core; this crate has no tests.
[[bin]]
name = "construct"
path = "src/main.rs"
test = false

[lints]
workspace = true

[dependencies]
construct-core.workspace = true
construct-tui.workspace = true
anyhow.workspace = true
clap.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
toml.workspace = true
toml_edit.workspace = true
serde_json.workspace = true
