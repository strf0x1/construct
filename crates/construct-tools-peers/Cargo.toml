[package]
name = "construct-tools-peers"
description = "construct's `peer` tool (send work to peers through the hub and be woken when it ends), registered by the binary's `hub` feature"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
autotests = false

[lib]
doctest = false

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true

[dependencies]
construct-core = { workspace = true, default-features = false }
anyhow.workspace = true
async-trait.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }

[dev-dependencies]
construct-core = { workspace = true, default-features = false, features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
