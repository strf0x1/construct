[package]
name = "construct-tools-web"
description = "construct's web tools (web_search, web_fetch), registered by the binary's `web` feature"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
autotests = false

[lib]
doctest = false

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true

[dependencies]
construct-core = { workspace = true, default-features = false }
anyhow.workspace = true
async-trait.workspace = true
htmd = "0.5"
# query and form are only for the search backends' requests.
reqwest = { workspace = true, features = ["query", "form"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
construct-core = { workspace = true, default-features = false, features = ["test-support"] }
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util"] }
toml.workspace = true
