[package]
name = "construct-tui"
description = "The construct TUI: a ratatui front end over construct-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# No integration tests: the TUI's unit tests live in src, and the e2e drives
# in construct-dev exercise the shipped binary.
autotests = false

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
construct-core.workspace = true
anyhow.workspace = true
async-trait.workspace = true
crossterm = { version = "0.29", features = ["event-stream"] }
futures.workspace = true
libc.workspace = true
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
toml.workspace = true
unicode-width = "0.2"

[dev-dependencies]
proptest.workspace = true
