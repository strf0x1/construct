[package]
name = "construct-deck"
description = "Deck-only tools for construct: the coordinator's `deck` tool, wired in by the composition root"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# One integration-test binary, listed in tests/it.rs like construct-core's.
autotests = false

[lib]
doctest = false

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true

[dependencies]
construct-core = { workspace = true, default-features = false }
anyhow.workspace = true
async-trait.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
