[package]
name = "construct-core"
description = "The construct engine: agent loop, tools, journal, learning"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# One test binary, tests/it.rs (the docs gate checks every sibling file is
# listed there): each extra integration binary relinks the whole lib.
autotests = false

[lib]
doctest = false

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
sha2 = "0.10"
futures.workspace = true
globset = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
htmd = "0.5"
ignore = "0.4"
libc.workspace = true
reqwest = { workspace = true, features = ["gzip", "query", "form"] }
rusqlite.workspace = true
secretspec.workspace = true
serde.workspace = true
serde_json.workspace = true
similar = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "sync", "time", "signal"] }
toml.workspace = true
toml_edit.workspace = true
unicode-normalization = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[dev-dependencies]
proptest.workspace = true
