[package]
name = "construct-core"
description = "The construct engine: agent loop, tools, journal, learning"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# One test binary, tests/it.rs (the docs gate checks every sibling file is
# listed there): each extra integration binary relinks the whole lib.
autotests = false

[lib]
doctest = false

[features]
default = ["keyring"]
# The OS keyring via secretspec. Off = env-only secrets: a preconfigured
# drop build (#271) carries no keyring/OpenPGP subtree and reads every
# credential from the environment (ADR 0051).
keyring = ["dep:secretspec"]

[build-dependencies]
toml.workspace = true

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
sha2.workspace = true
futures.workspace = true
globset = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
htmd = "0.5"
ignore = "0.4"
libc.workspace = true
reqwest = { workspace = true, features = ["gzip", "query", "form"] }
rusqlite.workspace = true
rustls.workspace = true
secretspec = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
similar = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "io-std", "sync", "time", "signal"] }
toml.workspace = true
toml_edit.workspace = true
unicode-normalization = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[target.'cfg(target_env = "musl")'.dependencies]
# Mozilla's roots for static builds (#293): these are the drop-in artifacts
# and may run on scratch/busybox, where no certificate store exists. Added as
# *extra* roots, never a replacement, so a managed host's CA still wins.
webpki-root-certs = "1"

[dev-dependencies]
proptest.workspace = true
