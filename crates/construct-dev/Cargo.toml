[package]
name = "construct-dev"
description = "Dev tools for construct: scripted/recording model endpoint, pty driver, bench helpers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# One test binary, tests/it.rs (the docs gate checks every sibling file is
# listed there): each extra integration binary relinks the whole lib.
autotests = false

[lib]
doctest = false

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
axum = "0.8"
bytes = "1"
clap.workspace = true
# The proxy's clients go through `construct_core::http` (#290), the one
# reqwest constructor; the e2e tests also read journals as `agent::Event`.
construct-core.workspace = true
futures.workspace = true
portable-pty = "0.9"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
secretspec.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["full"] }
vt100 = "0.18"

[dev-dependencies]
# The deck tool's name, for the e2e that drives it through the shipped binary.
construct-deck.workspace = true
# Offline payload conformance only; never linked into either shipped binary.
jsonschema = { version = "0.60.2", default-features = false }
rusqlite.workspace = true
insta = { version = "1.49.0", features = ["json"] }
# The trust tests run a local TLS server and generate their own CA/leaf;
# the shipped crates do not link any of this.
rustls.workspace = true
rcgen = "0.13"
time = { version = "0.3", default-features = false, features = ["std"] }
