[package]
name = "construct-dev"
description = "Dev tools for construct: scripted/recording model endpoint, pty driver, bench helpers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# One test binary, tests/it.rs (the docs gate checks every sibling file is
# listed there): each extra integration binary relinks the whole lib.
autotests = false

[lib]
doctest = false

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
axum = "0.8"
bytes = "1"
clap.workspace = true
futures.workspace = true
portable-pty = "0.9"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["full"] }
vt100 = "0.18"

[dev-dependencies]
# The e2e tests read the journal back and parse its rows as `construct::agent::Event`.
construct = { path = "../construct" }
rusqlite.workspace = true
insta = { version = "1.49.0", features = ["json"] }
