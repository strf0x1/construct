turns = [
"""This is commander.js. When an application option shadows one of the help option's flags, the help option loses its help group and is listed under the default `Options:` heading:

    const program = new Command()
      .option('-h, --host <host>')
      .addHelpOption(new Option('-h, --help', 'display help').helpGroup('Information:'));
    console.log(program.helpInformation());   // --help appears under "Options:", expected "Information:"

The help option must keep its configured group whichever of its flags (short or long) is shadowed, and whether the group was set with `Option.helpGroup()` or `Command.optionsGroup()`.

Add regression tests. The tests need no install: run them with `node --test tests/helpGroup.test.js`. When you are done, end with a short summary of what you changed and how you verified it.""",
]

