# Replay of https://github.com/more-itertools/more-itertools/pull/1322: redo a merged change from its intent; the PR's own
# tests, hidden from the model, score it (bench/external.py).
timeout_s = 1800
changes = ["more_itertools/*", "tests/*", "docs/*"]
turns = [
"""This is the more-itertools library. Fix a bug in `peekable`: a reverse slice with no stop, such as `peekable(count())[5::-1]`, should only need the first six items, but it reads and caches the whole source. On an infinite iterator it hangs; on a large one it buffers everything.

Wanted: a reverse slice with a non-negative start and an omitted stop reads the source only as far as `start + 1` items. Slices that really need the end of the source (a negative index, or a reverse slice with the start omitted) keep working as they do now, and normal iteration after slicing still yields every item in order.

Add a regression test that would fail rather than hang, and run the tests with `python3 -m unittest tests.test_more`. When you are done, end with a short summary of what you changed and how you verified it.""",
]

[budget]
max_requests = 80

[external]
url = "https://github.com/more-itertools/more-itertools"
pr = 1322
base = "4aeb4338ae1407d8da9723e86da99efeb446f719"
merge = "69dbc3392928afe1cc892a387bf0e721522f21c2"
hidden = ["tests/test_more.py"]
test = "timeout 120 python3 -m unittest tests.test_more"
