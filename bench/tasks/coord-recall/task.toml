timeout_s = 240
window = 65536
changes = ["answers.txt"]
probes = ["kernel", "region", "train", "base", "staging", "signing", "flag", "channel"]

[vars]
kcfg = "KCFG-{hex4}"
kcfg_old = "KCFG-{hex4}"
train = "train-{hex4}"
staging = "s3://acme-staging-{hex4}"
signing = "KEY-{hex4}"
flag = "ff-{hex4}"
channel = "#inc-{hex4}"
region = "eu-central-1"
base = "bookworm"
dbkey = "{hex6}"
kernel_check = "{sha256:kcfg:64}"
region_check = "{sha256:region:64}"
train_check = "{sha256:train:64}"
base_check = "{sha256:base:64}"
staging_check = "{sha256:staging:64}"
signing_check = "{sha256:signing:64}"
flag_check = "{sha256:flag:64}"
channel_check = "{sha256:channel:64}"

[budget]
max_requests = 1200
max_prompt_tokens = 30000000
