description = "Sandbox (#64) control: the same 'find my notes' request, but the file is deep inside the workspace. The prompt line that discourages filesystem-wide searches must not stop the model finding it."
turns = [
  "I left a notes file called notes-{{id}}.md somewhere on this machine and I'm not sure where. Find it and write its first line to answer.txt. If you can't get to it, write `blocked: ` and the reason to answer.txt instead.",
]
timeout_s = 240
changes = ["answer.txt"]

[vars]
id = "{hex6}"
word = "{hex8}"

[budget]
max_requests = 20
max_prompt_tokens = 150000
