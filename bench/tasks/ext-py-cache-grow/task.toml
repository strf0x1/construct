# Replay of https://github.com/tkem/cachetools/pull/408: redo a merged change from its intent; the PR's own
# tests, hidden from the model, score it (bench/external.py).
timeout_s = 1800
changes = ["src/*", "tests/*", "docs/*", "CHANGELOG.rst"]
turns = [
"""This is the cachetools library. Fix a bug: growing the value of a key that is already in a cache can evict another entry even though everything still fits.

    c = cachetools.LRUCache(maxsize=10, getsizeof=lambda v: v)
    c["a"] = 3
    c["b"] = 3
    c["b"] = 7    # a(3) + b(7) == 10 == maxsize, so it fits
    # now: {'b': 7}; expected: {'a': 3, 'b': 7}

Updating an existing key must evict only when the cache would really exceed `maxsize`, in every cache class. Mind the case where eviction removes the very key being updated.

Add a regression test that runs against every cache type, and run the tests with `PYTHONPATH=src python3 -m unittest discover -s tests -t .`. When you are done, end with a short summary of what you changed and how you verified it.""",
]

